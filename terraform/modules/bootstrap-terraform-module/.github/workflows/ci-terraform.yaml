---
name: 'CI - Terraform'
on:
  pull_request:
    paths-ignore:
      - '.github/**'
      - 'CODEOWNERS'
      - 'README.md'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  checkov:
    uses:
      emergn-infinity/pipelines/.github/workflows/checkov.yaml@main
    with:
      directory: .
      framework: terraform
      soft_fail: false
      skip_check: CKV_TF_1,CKV_GIT_4,CKV_GIT_5,CKV_GIT_6,CKV_AWS_7,CKV_AWS_18,CKV_AWS_28,CKV2_AWS_62,CKV_AWS_119,CKV_AWS_144,CKV_AWS_145
    secrets: inherit

  plan:
    name: 'Plan'
    needs: checkov
    uses:
      emergn-infinity/pipelines/.github/workflows/terraform-module-plan.yaml@main
    with:
      ci-runner-type: # ubuntu-latest or ubuntu-22.04-4core if need mongodb atlas access
    secrets: inherit

  how-to-use:
    if: github.event_name == 'pull_request'
    name: 'How to use this module'
    needs: plan
    uses:
      emergn-infinity/pipelines/.github/workflows/terraform-module-usage.yaml@main
    with:
      how-to-use: |
        module "{example_name}" {
          source = "git::https://github.com/emergn-infinity/terraform-module-{example_name}.git?ref=vX.X.X"

          key = "{value}"
        }
    secrets: inherit

  docs:
    if: github.event_name == 'pull_request'
    name: 'README file update'
    needs: [plan]
    uses:
      emergn-infinity/pipelines/.github/workflows/readme-update.yaml@main
    secrets: inherit

...