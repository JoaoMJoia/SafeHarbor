# Container Logs Dashboard
# This dashboard is used to monitor the container logs.
# These alerts are not part of the default rules and are added to the PrometheusRule object.
## kubectl apply -n infrastructure -f container-logs.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    grafana_dashboard: "1"
  name: dashboard-container-logs
  namespace: infrastructure
data:
  dashboard-container-logs.json: |-
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "datasource",
              "uid": "grafana"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "target": {
              "limit": 100,
              "matchAny": false,
              "tags": [],
              "type": "dashboard"
            },
            "type": "dashboard"
          }
        ]
      },
      "description": "Logs collected from Kubernetes, stored in Loki",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "gnetId": 15141,
      "graphTooltip": 0,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "datasource": {
            "type": "loki",
            "uid": "P982945308D3682D1"
