# AWS Certificate Dashboard
# This dashboard is used to monitor the AWS Certificate.
# These alerts are not part of the default rules and are added to the PrometheusRule object.
## kubectl apply -n infrastructure -f aws-certificate.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    grafana_dashboard: "1"
  name: dashboard-aws-certificate
  namespace: infrastructure
data:
  dashboard-aws-certificate.json: |-
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "datasource",
              "uid": "grafana"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
