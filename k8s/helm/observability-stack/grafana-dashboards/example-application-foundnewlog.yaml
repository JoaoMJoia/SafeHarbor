# Example Application Found New Log Dashboard
# This dashboard is used to monitor the Example Application found new log.
# These alerts are not part of the default rules and are added to the PrometheusRule object.
## kubectl apply -n infrastructure -f example-application-foundnewlog.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    grafana_dashboard: "1"
  name: dashboard-production-example-application-found-new-log
  namespace: infrastructure
data:
  dashboard-production-example-application-found-new-log.json: |-
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
