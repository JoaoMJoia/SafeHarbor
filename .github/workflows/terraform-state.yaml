---
# This workflow is used to run the Terraform state command.
name: "Terraform State Infrastructure"

on:
  workflow_dispatch:
    inputs:
      folder:
        description: "Folder to run state command"
        required: true
        default: "terraform"
        type: choice
        options:
          - terraform
      arguments:
        description: |
          Pass your state arguments:
          - identities -json    List the identities of resources in the state
          - list                List resources in the state
          - mv                  Move an item in the state
          - rm                  Remove instances from the state
          - show                Show a resource in the state
          Examples: 
        default: "list, show aws_instance.example, rm aws_s3_bucket.example"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ROLE_TO_ASSUME: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-terraform
  TF_VERSION: 1.14.5

jobs:
  state:
    name: 'State ${{ inputs.arguments }} on ${{ inputs.folder }}'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.folder }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        id: init
        run: |
          terraform init -upgrade

      - name: Terraform state ${{ inputs.arguments }}
        id: state
        run: terraform state ${{ inputs.arguments }}
...