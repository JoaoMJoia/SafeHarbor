---
# This workflow is used to run the CI pipeline for the Terraform infrastructure on label.
name: 'Terraform CI on label'
on:
  workflow_call:
    inputs:
      terraform-folder:
        description: 'The folder name of the terraform code'
        required: true
        type: string
      tf-version:
        description: 'The Terraform version to use'
        required: false
        type: string
        default: '1.9.7'

permissions:
  id-token: write
  contents: write
  pull-requests: write

env:
  TF_VERSION: ${{ inputs.tf-version }}
  ENV_FOLDER: ${{ inputs.terraform-folder }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  ROLE-TO-ASSUME: arn:aws:iam::${{ secrets.AWS_ORG_ACCOUNT }}:role/github-example
  INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}

jobs:
  checkov:
    if: github.event.action != 'labeled'
    uses:
      emergn-infinity/pipelines/.github/workflows/checkov.yaml@main
    with:
      directory: ${{ inputs.terraform-folder }}
      framework: terraform
      soft_fail: false
      skip_check: CKV_TF_1,CKV_AWS_7,CKV_GIT_4,CKV_GIT_5,CKV_GIT_6
    secrets: inherit

  plan:
    name: 'Plan ${{ inputs.terraform-folder }}'
    needs: checkov
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.ENV_FOLDER }}
    env:
      GITHUB_TOKEN: ${{ secrets.TF_MANAGE_GITHUB_TOKEN }}
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v6
      - name: Configure Git credentials for private module access
        run: |
          git config --global url."https://x-access-token:${{ env.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - name: List directory
        run: |
          ls -lhatr
      - name: Login to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE-TO-ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Terraform Init
        id: init
        run: |
          terraform init -upgrade -no-color
      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color
      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false -out=plan.tfplan

      - name: Post Terraform Summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7.0.1
        with:
          github-token: ${{ github.token }}
          script: |
            const output = `## 🚀 Infrastructure Changes Summary

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Working Directory: \`${{ env.ENV_FOLDER }}\`, Workflow: \`${{ github.workflow }}\`*
            
            ### 🔍 Terraform Status
            - Initialization ⚙️: \`${{ steps.init.outcome }}\`
            - Validation 🤖: \`${{ steps.validate.outcome }}\`

            <details><summary>Validation Details</summary>

            \`\`\`
            ${{ steps.validate.outputs.stdout }}
            \`\`\`

            </details>

            ### 📖 Terraform Plan
            ❗️ Please review the changes carefully before approving the PR ❗️

            <details><summary>Show Plan</summary>

            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`

            </details>

            ### 📚 How to Deploy
            To proceed with the deployment:
            1. ✅ Review the plan changes above
            2. 🏷️ Apply the label \`${{ inputs.terraform-folder }}\` to initiate the deployment

            > ⚠️ Please ensure you've reviewed all changes carefully before proceeding with the deployment.
            `;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  infracost:
    if: github.event_name == 'pull_request'
    name: 'Cloud Infracost'
    needs: [plan]    
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.TF_MANAGE_GITHUB_TOKEN }}
    steps:
      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ env.INFRACOST_API_KEY }}
          
      - name: Repository base Checkout
        uses: actions/checkout@v6
        with:
          ref: '${{ github.event.pull_request.base.ref }}'

      - name: Configure Git credentials for private module access
        run: |
          git config --global url."https://x-access-token:${{ env.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Generate Infracost cost estimate baseline
        run: |
          infracost breakdown --path=${{ inputs.terraform-folder }} \
                              --format=json \
                              --out-file=/tmp/infracost-base.json

      - name: Checkout PR branch
        uses: actions/checkout@v6

      - name: Generate Infracost diff
        run: |
          infracost diff --path=${{ inputs.terraform-folder }} \
                          --format=json \
                          --compare-to=/tmp/infracost-base.json \
                          --out-file=/tmp/infracost.json

      - name: Post Infracost comment
        run: |
          infracost comment github --path=/tmp/infracost.json \
                                     --repo=$GITHUB_REPOSITORY \
                                     --github-token=${{github.token}} \
                                     --pull-request=${{github.event.pull_request.number}} \
                                     --behavior=hide-and-new

  docs:
    if: github.event_name == 'pull_request'
    name: 'README update'
    needs: [plan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: terraform-docs/gh-actions@v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          working-dir: ${{ env.ENV_FOLDER }}
          output-file: README.md
          output-method: inject
          git-push: "true"
          git-commit-message: "${{ env.ENV_FOLDER }}: README.md update automated action"

...