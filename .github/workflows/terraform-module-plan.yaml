---
# This workflow is used to plan the Terraform module.
name: 'Terraform Module Plan'
on:
  workflow_call:
    inputs:
      example-folder:
        description: 'Path to the example folder'
        type: string
        required: false
        default: 'terraform/modules/github/example/'
      tf-version:
        description: 'Terraform version'
        type: string
        required: false
        default: '1.12.1'
      ci-runner-type:
        description: 'The runner type: ubuntu-latest or ubuntu-22.04-4core if need mongodb atlas access'
        required: true
        type: string

permissions:
  id-token: write
  contents: write
  pull-requests: write

env:
  TF_VERSION: ${{ inputs.tf-version }}
  ENV_FOLDER: ${{ inputs.example-folder }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  ROLE-TO-ASSUME: arn:aws:iam::${{ secrets.AWS_ORG_ACCOUNT }}:role/github-elp-infrastructure
  MONGODB_ATLAS_PUBLIC_KEY: ${{ vars.MONGODB_ATLAS_PUBLIC_KEY }}
  MONGODB_ATLAS_PRIVATE_KEY: ${{ secrets.MONGODB_ATLAS_PRIVATE_KEY }}

jobs:
  plan:
    name: 'Plan'
    runs-on: ${{ inputs.ci-runner-type }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.ENV_FOLDER }}
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v6
      - name: List directory
        run: |
          ls -lhatr
      - name: Login to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE-TO-ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Terraform Init
        id: init
        run: |
          terraform init -upgrade -no-color
      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color
      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false -out=plan.tfplan
      - name: Post Terraform Summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7.0.1
        with:
          github-token: ${{ github.token }}
          script: |
            const output = `## 🚀 Drift Terraform Module

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Working Directory: \`${{ env.ENV_FOLDER }}\`, Workflow: \`${{ github.workflow }}\`*
            
            ### 🔍 Validation Status
            - Initialization ⚙️: \`${{ steps.init.outcome }}\`
            - Validation 🤖: \`${{ steps.validate.outcome }}\`

            <details><summary>Validation Details</summary>

            \`\`\`
            ${{ steps.validate.outputs.stdout }}
            \`\`\`

            </details>

            ### 📖 Plan
            This plan shows how the module behaves with the example configuration:

            <details><summary>Show Plan</summary>

            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`

            </details>
            `;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });
...