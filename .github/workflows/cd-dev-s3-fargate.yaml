---
# This workflow is used to deploy the frontend and backend to the dev environment.
name: CD - Dev S3 and Fargate

on:
  # push:
  #   branches:
  #     - dev
  #   paths-ignore:
  #     - ".github/**"
  #     - ".husky/**"
  #     - "README.md"
  #     - ".gitignore"
  #     - "CODEOWNERS"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  NOTIFY_CHANNEL: ${{ vars.TEAMS_WEBHOOK_EXAMPLE_URL }}
  # AWS
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  ROLE_TO_ASSUME: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-terraform
  # Frontend
  AWS_S3_BUCKET_NAME: example-dev-frontend
  # Backend
  BACKEND_WORKING_DIR: backend
  APPLICATION_NAME: example-dev-backend
  AWS_ECS_CONTAINER_NAME: backend-app
  TASK_DEFINITION_FILE: ecs/webserver/task_definition.json
  APP_URL: https://example-dev-backend-__ALB_ID__.${{ vars.AWS_REGION }}.elb.amazonaws.com

jobs:
  frontend:
    name: Deploy frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setting up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Install deps (include dev)
        run: |
          bun ci --include=dev

      - name: Build application
        run: |
          bun run build

      - name: Deploy on S3
        run: |
          aws s3 sync dist/ s3://${{ env.AWS_S3_BUCKET_NAME }} --delete

      - name: Deploy on S3 failover
        run: |
          aws s3 sync dist/ s3://${{ env.AWS_S3_BUCKET_NAME }}-failover --delete
  
  backend:
    name: Deploy backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./${{ env.BACKEND_WORKING_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: List task definition file
        run: |
          ls -lhtar ${{ env.TASK_DEFINITION_FILE }}

      - name: Set image tag timestamp
        id: timestamp
        run: |
          tag=$(date -u +%Y%m%d-%H%M%S)
          echo "tag=$tag" >> $GITHUB_OUTPUT
          echo "tag: $tag"

      - name: Build, tag, and push docker image to Amazon ECR
        id: build-image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ env.APPLICATION_NAME }}
          IMAGE_TAG: ${{ steps.timestamp.outputs.tag }}
        run: |
          docker build --target prod -t $REGISTRY/$REPOSITORY:$IMAGE_TAG -f Dockerfile .
          echo "Docker image built and tagged"
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          echo "Docker image pushed to ECR"
          echo "image=$REGISTRY/$REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Print the image ID
        run: |
          echo "Docker image ID: ${{ steps.build-image.outputs.image }}"
      
      - name: Task definition - Env variables
        run: |
          sed -i "s~___APP_URL___~${{ env.APP_URL }}~g" ${{ env.TASK_DEFINITION_FILE }}
          sed -i "s~___APPLICATION_NAME___~${{ env.APPLICATION_NAME }}~g" ${{ env.TASK_DEFINITION_FILE }}
          sed -i "s~___AWS_REGION___~${{ env.AWS_REGION }}~g" ${{ env.TASK_DEFINITION_FILE }}
          sed -i "s~___AWS_ACCOUNT_ID___~${{ env.AWS_ACCOUNT_ID }}~g" ${{ env.TASK_DEFINITION_FILE }}
      
      - name: Print the task definition
        run: |
          cat ${{ env.TASK_DEFINITION_FILE }}

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: render-backend-app
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.BACKEND_WORKING_DIR }}/${{ env.TASK_DEFINITION_FILE }}
          task-definition-family: ${{ env.APPLICATION_NAME }}-ecs-webserver-task
          container-name: ${{ env.AWS_ECS_CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy to Amazon ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-backend-app.outputs.task-definition }}
          service: ${{ env.APPLICATION_NAME }}-ecs-webserver-service
          cluster: ${{ env.APPLICATION_NAME }}-ecs-cluster

  notify:
    name: Send notification
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - name: Send notification
        uses: jdcargile/ms-teams-notification@v1.4
        with:
          github-token: ${{ github.token }}
          ms-teams-webhook-uri: ${{ env.NOTIFY_CHANNEL }}
          notification-color: '#00FF00'
          notification-summary: "✅ Dev deployment completed – frontend and backend deployed successfully"
      
      - name: EMERGN - Send notification
        uses: jdcargile/ms-teams-notification@v1.4
        with:
          github-token: ${{ github.token }}
          ms-teams-webhook-uri: ${{ vars.EMERGN_SAUDE_MSTEAMS_ALERTING_CHANNEL }}
          notification-color: '#00FF00'
          notification-summary: "✅ Dev deployment completed – frontend and backend deployed successfully"
  
  migrations:
    name: Run migrations on backend
    needs: [backend]
    uses: ./.github/workflows/migrations-backend.yaml
    with:
      environment: dev
    secrets: inherit
...