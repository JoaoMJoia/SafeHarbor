---
# This workflow is used to check the Terraform module compatibility.
name: 'Terraform Module Compatibility Check'
on:
  workflow_call:
    inputs:
      example-folder:
        description: 'Path to the example folder'
        type: string
        required: false
        default: 'terraform/modules/github/example/'
      terraform-versions:
        description: 'List of Terraform versions to test'
        type: string
        required: false
        default: '["1.9.7", "1.10.0", "1.12.1"]'

permissions:
  id-token: write
  contents: write
  pull-requests: write

env:
  ENV_FOLDER: ${{ inputs.example-folder }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  ROLE-TO-ASSUME: arn:aws:iam::${{ secrets.AWS_ORG_ACCOUNT }}:role/github-elp-infrastructure

jobs:
  version-compatibility:
    name: 'Version Compatibility'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        terraform_version: ${{ fromJSON(inputs.terraform-versions) }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.ENV_FOLDER }}
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v6
      - name: Login to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE-TO-ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ matrix.terraform_version }}
      - name: Terraform Init
        run: terraform init -upgrade -no-color
      - name: Terraform Validate
        run: terraform validate -no-color
      - name: Check Module Syntax
        run: |
          terraform fmt -check -recursive
          terraform validate -json | jq -r '.diagnostics[] | select(.severity=="error")'
      - name: Verify Provider Compatibility
        run: |
          terraform providers schema -json | jq -r '.provider_schemas | keys[]'
...